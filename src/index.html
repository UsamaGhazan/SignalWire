    <!-- translator popup -->
    <style>
      ctranslator {
        position: fixed;
        z-index: 9999999;
        display: block;
        padding: 0.3rem;
        padding-top: 0;
        background: #f4f4f4;
        border-radius: 4px;
        box-shadow: 2px 4px 14px rgba(15, 15, 15, 0.45);
      }

      #c_translator_text {
        display: inline-block;
        max-width: 400px;
        min-width: 200px;
        max-height: calc(300px - 24px);
      }
    </style>
    <script>
      var custom_tselection_flag = false;
      var custom_tselection_text = "";
      var custom_translated_text = "";
      document.addEventListener("DOMContentLoaded", function () {
        // Add an event listener to the document body for various events
        document.body.addEventListener(
          "mouseup",
          (e) => {
            if (
              e.target.classList.contains("ctb_") ||
              window.location.href.includes("/admin")
            )
              return;
            var selection;
            if (window.getSelection) {
              selection = window.getSelection();
            } else if (document.selection) {
              selection = document.selection.createRange();
            }
            if (
              selection.toString() &&
              selection.toString()?.trim()?.replaceAll(" ", "") !== ""
            ) {
              custom_tselection_flag = true;
              custom_tselection_text = selection.toString();
            } else {
              custom_tselection_flag = false;
              custom_tselection_text = selection.toString();
              return;
            }
            window.document.querySelectorAll("ctranslator").forEach((x) => {
              x.remove();
            });
            var popup = document.createElement("ctranslator");
            popup.id = "translator_popup";
            popup.innerHTML = `
        <div class="d-flex justify-content-between align-items-center bg-secondary text-white gap-2 py-1 px-2" 
          style="margin-left: -0.3rem; margin-right: -0.3rem;">
          <div class="d-flex">
            ${
              !isEnglish(selection.toString())
                ? `<i id="c_translator_trigger" class="f-16 fa fa-language hovered_btn ctb_" title="translate" data-toggle="tooltip" onclick="translateByCustomApi()"></i>`
                : ""
            }
          </div>
          <div class="d-flex gap-3 align-items-center">
            <i class="ctb_ f-16 fa fa-copy hovered_btn" onclick="copy_translated_text()"></i>
            <i class="ctb_ fa fa-times hovered_btn" onclick="clearSelection();this.parentElement.parentElement.parentElement.remove()"></i>
          </div>
        </div>
        <div class="mt-2">
          <span class="scrollbar-danger w-100 overflow-y-auto f-16" id="c_translator_text">${selection.toString()}</span>
        </div>`;
            let p_w = 400;
            let p_h = 330;
            let left =
              e.pageX >= window.innerWidth - p_w
                ? window.innerWidth - p_w
                : e.pageX;
            let top =
              e.pageY >= window.innerHeight - p_h
                ? window.innerHeight - p_h
                : e.pageY;
            popup.setAttribute("style", `left:${left}px;top: ${top}px;`);
            window.document.body.appendChild(popup);
          },
          true
        );

        document.body.addEventListener("click", preventDefaultHandler, true);
        document.body.addEventListener(
          "contextmenu",
          preventDefaultHandler,
          true
        );
        document.body.addEventListener(
          "mousedown",
          (e) => {
            if (event.target.nodeName == "INPUT")
              event.target.classList.add("ctb_");
            if (
              event.target.classList.contains("ctb_") ||
              window.location.href.includes("/admin")
            )
              return;
            custom_tselection_flag = false;
            document
              .querySelectorAll("ctranslator")
              ?.forEach((x) => x.remove());
            clearSelection();
          },
          true
        );
   
        function preventDefaultHandler(event) {
          if (
            event.target.classList.contains("ctb_") ||
            window.location.href.includes("/admin")
          )
            return;
          var selection;
          if (window.getSelection) {
            selection = window.getSelection();
          } else if (document.selection) {
            selection = document.selection.createRange();
          }
          if (
            selection.toString() &&
            selection.toString()?.trim()?.replaceAll(" ", "") != ""
          ) {
            custom_tselection_flag = true;
          } else {
            custom_tselection_flag = false;
          }
          !custom_tselection_flag &&
            document
              .querySelectorAll("ctranslator")
              ?.forEach((x) => x.remove());
          if (custom_tselection_flag) {
            // Prevent the default behavior of the event
            event.preventDefault();
            // Stop the event from propagating up or down the DOM
            event.stopPropagation();
          }
        }
      });
      function copy_translated_text(e) {
        var body = window.document.body;
        var el = window.document.createElement("input");
        el.style.width = "0";
        el.style.height = "0";
        el.value = custom_tselection_text;
        el.focus();
        let flag = navigator.clipboard.writeText(el.value);
        el.remove();
      }

      function clearSelection() {
        if (window.getSelection) {
          // Get the current selection
          var selection = window.getSelection();

          // Check if there is any selection
          if (selection.rangeCount > 0) {
            // Remove all ranges from the selection
            selection.removeAllRanges();
          }
        } else if (document.selection) {
          // For Internet Explorer 8 and earlier
          document.selection.empty();
        }
        custom_tselection_flag = false;
        custom_tselection_text = "";
      }

      function isEnglish(text) {
        // Regular expression to match English letters and common punctuation
        var englishRegex = /^[a-zA-Z0-9!@#$%^&*(),.?":{}|<>_#\s]*$/;

        // Check if the text matches the English regex
        return englishRegex.test(text);
      }
  function translateByCustomApi() {
        let text = $("#c_translator_text").html();
        $("#c_translator_text").html(`
    <div class="w-100 placeholder-glow">
      <div class="col-12 placeholder bg-secondary"></div>
    </div>
  `);
        const apiUrl = "https://zulon.ai/get_translation";
        const requestBody = {
          text: text,
        };

        fetch(apiUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(requestBody),
        })
          .then((response) => response.json())
          .then((data) => {
            // Use only translated text from response
            let translatedText = data.translated;

            console.log("Translated:", translatedText);

            custom_translated_text = translatedText;
            custom_tselection_text = custom_translated_text;

            $("#c_translator_text")?.html(custom_translated_text);
            $("#c_translator_trigger")?.hide();
          })
          .catch((error) => {
            console.error("Error:", error);
          });
      }
     
    </script>
