<div
  class="report d-flex w-60px customhehe"
  style="border: 1px solid #8080801f; padding: 5px; border-radius: 7px"
>
  <button
    class="report-btn position-relative d-flex flex-column align-items-center"
    data-bs-toggle="modal"
    data-bs-target="#report_modal"
    (click)="getReportNews(); getReportTweets()"
  >
    <img
      class="h-30px"
      src="../../../../../assets/news-img/report-icon.png"
      alt=""
      title="Generate Report"
    />
    <p class="f-12 fw-700 manrope text-black">Report</p>
    <ng-container>
      <div
        class="spinner-border text-secondary position-absolute"
        role="status"
        style="
          width: 1rem;
          height: 1rem;
          color: #c94921 !important;
          top: -5px;
          right: 5px;
          border-width: 0.18rem;
        "
        *ngIf="rep_flag == 'pending'"
      >
        <span class="visually-hidden">Loading...</span>
      </div>
      <div
        class="text-secondary position-absolute"
        style="
          width: 10px;
          height: 10px;
          color: #1c8b15 !important;
          top: -5px;
          right: 5px;
        "
        *ngIf="rep_flag == 'done'"
      >
        <span class=""
          ><i
            class="fa-solid fa-check f-16"
            style="
              -webkit-text-stroke-width: 1.5px;
              -webkit-text-stroke-color: #1c8b15;
            "
          ></i
        ></span>
      </div>
      <!-- <span class="position-absolute placeholder-wave placeholder bg-transparent text-secondary" 
                style="top:-1.5rem;left:50%;transform:translateX(-50%);"></span> -->
    </ng-container>
  </button>
</div>
<!-- Modal East report -->
<div
  class="modal fade news-reporting"
  id="report_modal"
  tabindex="-1"
  aria-labelledby="report_modalLabel"
  aria-hidden="true"
  *ngIf="origin == 'east_corner'"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-head-bg">
          <h1
            class="modal-title f-20 text-white spaceGrotesk fw-700"
            id="priority_modalLabel"
          >
            Report
          </h1>
        </div>
        <div class="form-check">
          <!-- <app-news-filter context="report" [date]="Dates['report']" (onChange)="changeFilter($event)"></app-news-filter> -->
          <div class="tgl-radio-tabs d-flex justify-content-end cg-8">
            <input
              [id]="'report' + '_1'"
              type="radio"
              class="form-check-input tgl-radio-tab-child"
              [attr.name]="'report' + '_filter'"
              [checked]="Dates['report'] == 'current'"
              (click)="changeFilter('current')"
            />
            <label [attr.for]="'report' + '_1'" class="radio-inline"
              >Latest</label
            >

            <!-- <input [id]="'report'+'_2'" type="radio" class="form-check-input tgl-radio-tab-child"
                            [attr.name]="'report'+'_filter'" [checked]="Dates['report']=='24hour'" (click)="changeFilter('24hour')"/>
                        <label [attr.for]="'report'+'_2'" class="radio-inline">24 Hours</label> -->
            <input
              [id]="'report' + '_3'"
              type="radio"
              class="form-check-input tgl-radio-tab-child"
              [attr.name]="'report' + '_filter'"
              [checked]="Dates['report'] == '48hour'"
              (click)="changeFilter('48hour')"
            />
            <label [attr.for]="'report' + '_3'" class="radio-inline"
              >48 Hours</label
            >

            <input
              [id]="'report' + '_4'"
              type="radio"
              class="form-check-input tgl-radio-tab-child"
              [attr.name]="'report' + '_filter'"
              [checked]="Dates['report'] == '7days'"
              (click)="changeFilter('7days')"
            />
            <label [attr.for]="'report' + '_4'" class="radio-inline"
              >7 Days</label
            >

            <input
              [id]="'report' + '_5'"
              type="radio"
              class="form-check-input tgl-radio-tab-child"
              [attr.name]="'report' + '_filter'"
              [checked]="Dates['report'] == '2weeks'"
              (click)="changeFilter('2weeks')"
            />
            <label [attr.for]="'report' + '_5'" class="radio-inline"
              >2 Weeks</label
            >
          </div>
        </div>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body mt-3">

          <div class="tgl-radio-tabs d-flex justify-content-end cg-8">

              [id]="'report' + '_1'"
              type="radio"
              class="form-check-input tgl-radio-tab-child"
              [attr.name]="'report' + '_filter'"
              [checked]="Dates['report'] == 'current'"
              (click)="changeFilter('current')"
            />
            <label [attr.for]="'report' + '_1'" class="radio-inline"

            <label [attr.for]="'report' + '_3'" class="radio-inline"
