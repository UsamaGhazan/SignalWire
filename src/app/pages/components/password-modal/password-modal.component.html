<h2 mat-dialog-title style="color: black;">Change Password</h2>
<div mat-dialog-content>
  <mat-form-field appearance="fill" class="w-100">
    <mat-label>New Password</mat-label>
    <input matInput [(ngModel)]="newPassword" [type]="newPasswordHide ? 'password' : 'text'" />

    <button mat-icon-button matSuffix (click)="newPasswordHide = !newPasswordHide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="newPasswordHide">
      <mat-icon>{{newPasswordHide ? 'visibility_off' : 'visibility'}}</mat-icon>
    </button>
  </mat-form-field>

  <mat-form-field appearance="fill" class="w-100">
    <mat-label>Confirm Password</mat-label>
    <input matInput [(ngModel)]="confirmPassword" [type]="confirmPasswordHide ? 'password' : 'text'" />
    
    <button mat-icon-button matSuffix (click)="confirmPasswordHide = !confirmPasswordHide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="confirmPasswordHide">
      <mat-icon>{{confirmPasswordHide ? 'visibility_off' : 'visibility'}}</mat-icon>
    </button>
  </mat-form-field>
</div>

<div mat-dialog-actions class="justify-end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-button color="primary" (click)="onSave()">Save</button>
</div>
