<ng-container *ngIf="type == 'horizontal'">
  <div
    class="mm-card horizontal d-flex cg-12 pd-8"
    #news_div
    [id]="'news_' + news?.id"
    (click)="navigate('/news-details', corner, news?.id)"
    (contextmenu)="
      !disableContext
        ? this.api.genContext($event, news_div, {
            id: news?.id,
            title: news?.title,
            content: news,
            corner: corner,
            cat: cat,
            subCat: news?.sub_cat,
            type: 'news'
          })
        : ''
    "
  >
    <div class="mm-left pdy-2">
      <img
        class="mm-profile category-news-image"
        [src]="news?.image"
        onerror="this.src='/assets/images/noimg-small.png'"
        alt=""
      />
    </div>
    <div class="mm-right">
      <div class="mm-top">
        <p
          class="text-black f-18 fw-700 spaceGrotesk text-truncate2 mouse"
          [innerHTML]="news?.title"
        ></p>
      </div>
      <div
        class="mm-bottom mt-1 d-flex align-items-center justify-content-between"
      >
        <p
          class="text-black manrope f-12 fw-500 text-opacity2 text-truncate2"
          [innerHTML]="news?.description"
        ></p>
        <button
          class="d-flex cg-8 mm-button"
          (click)="gotoLink($event, news?.news_link)"
          *ngIf="buttonStyle == 'long'"
        >
          <p class="text-white manrope f-14 fw-600 text-nowrap">Read More</p>
          <i class="fa-solid fa-chevron-right chevron-custom"></i>
        </button>
        <button
          class="d-flex cg-8 mm-button mt-2 border-rounded pd-5"
          (click)="gotoLink($event, news?.news_link)"
          *ngIf="buttonStyle == 'round'"
        >
          <i
            class="fa-solid fa-chevron-right chevron-only text-white align-items-center justify-content-center"
          ></i>
        </button>
      </div>
      <p class="manrope f-10 fw-700 text-black">{{ news.published_date }}</p>
    </div>
  </div>
</ng-container>

<ng-container *ngIf="type == 'vertical'">
  <div
    class="mm-card vertical d-flex flex-column cg-12 pd-8"
    #news_div
    [id]="'news_' + news?.id"
    (click)="navigate('/news-details', corner, news.id)"
    (contextmenu)="
      !disableContext
        ? this.api.genContext($event, news_div, {
            id: news?.id,
            title: news?.title,
            corner: corner,
            content: news,
            cat: cat,
            subCat: news?.sub_cat,
            type: 'news'
          })
        : ''
    "
  >
    <div class="mm-upper">
      <img
        class="mm-uper-img w-100"
        [src]="news.image"
        onerror="this.src='/assets/images/noimg-small.png'"
        alt=""
      />
    </div>
    <div class="mm-middle mt-2">
      <div
        class="d-flex flex-column align-items-center justify-content-between"
      >
        <p
          class="text-black f-18 fw-700 spaceGrotesk text-truncate2 mouse"
          [innerHTML]="news.title"
        ></p>
        <p
          class="text-black manrope f-12 fw-500 text-opacity2 text-truncate2"
          [innerHTML]="news.description"
        ></p>
      </div>
    </div>
    <div class="mm-lower d-flex align-items-center justify-content-center">
      <button
        class="d-flex cg-8 mm-button mt-2 border-rounded pd-5"
        (click)="gotoLink($event, news.news_link)"
      >
        <i
          class="fa-solid fa-chevron-right chevron-only text-white align-items-center justify-content-center"
        ></i>
      </button>
    </div>
    <p class="manrope f-10 fw-700 text-black">{{ news.published_date }}</p>
  </div>
</ng-container>

<ng-container *ngIf="type == 'image'">
  <div
  class="image-card position-relative d-flex flex-column justify-content-between"
  [ngClass]="getCatClass()"
  #news_div
    (click)="navigate('/news-details', corner, news.id)"
    [id]="'news_' + news?.id"
    (contextmenu)="
      !disableContext
        ? this.api.genContext($event, news_div, {
            id: news?.id,
            title: news?.title,
            corner: corner,
            content: news,
            cat: cat,
            subCat: news?.sub_cat,
            type: 'news'
          })
        : ''
    "
    [class.textGradientVariable]="textGradientVariable"
  >
    <img
      class="back-image"
      [src]="news?.image"
      onerror="this.src='/assets/images/noimg-small.png'"
      alt=""
    />
    <div class="icard-top pd-16 w-100 d-flex justify-content-between">
      <p class="shashka-d-time f-12 manrope fw-600">
        {{ news?.published_date }}
      </p>
      <p class="shashka-news-source f-12 manrope fw-600">
        Source: {{ news?.source }}
      </p>
    </div>
    <div class="icard-mid pd-16">
      <p
        class="f-20 spaceGrotesk fw-700 text-white truncate-text2 mouse"
        [innerHTML]="news.title"
      ></p>
      <div class="d-flex align-items-end">
        <p
          class="text-white f-12 truncate-text2 manrope fw-500 text-opacity3"
          [innerHTML]="news.description"
        ></p>
        <a
          class="no-underline text-white f-14 manrope fw-400 text-nowrap mouse"
          (click)="gotoLink($event, news.news_link)"
          >Read More</a
        >
      </div>
    </div>
  </div>
</ng-container>
