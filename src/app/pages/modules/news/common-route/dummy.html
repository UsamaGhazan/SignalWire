<div class="xc-tabs h-100 overflow-hidden">
  <div class="tab-content h-100" id="pills-tabContent">
    <ng-container *ngFor="let key of getKeysArray(); let i = index">
      <div
        [classList]="
            'tab-pane h-100 overflow-y-auto scrollbar-news fade ' +
            (i == 0 ? 'show active' : '')
          "
        [id]="'pills-comd-' + (i + 1)"
        role="tabpanel"
        [attr.aria-labelledby]="'pills-comd-' + (i + 1) + '-tab'"
        [attr.tabindex]="i"
        (scroll)="
            checkScrolled_($event, 'tweet', 'tweetsCombined')
          "
      >
        <div class="card1 story-card w-100 no-border pb-4">
          <div class="shashka-mid d-flex flex-column rg-8 scrollbar-news pd-16">
            <ng-container
              *ngIf="
                  !api.tweetList['tweetsCombined']?.length &&
                  !loader_flag.tweet
                "
            >
              <div class="placeholder-glow mb-1" *ngFor="let l of [1, 1, 1, 1]">
                <div class="placeholder col-12 bg-light rounded-3 p-2">
                  <div class="d-flex align-items-center gap-3">
                    <div
                      class="placeholder bg-secondary rounded-circle flex-shrink-0"
                      style="width: 41px; height: 41px"
                    ></div>
                    <div class="d-flex flex-column w-full">
                      <div
                        class="placeholder col-5 bg-secondary p-0 m-0"
                        style="min-height: 10px"
                      ></div>
                      <div
                        class="placeholder col-4 bg-secondary p-0 mt-1"
                        style="min-height: 5px"
                      ></div>
                    </div>
                  </div>
                  <div class="mt-3 d-flex flex-column gap-2">
                    <div
                      class="placeholder col-12 p-0 bg-secondary"
                      style="min-height: 8px"
                    ></div>
                    <div
                      class="placeholder col-11 py-0 bg-secondary"
                      style="min-height: 8px"
                    ></div>
                    <div
                      class="placeholder col-12 py-0 bg-secondary"
                      style="min-height: 8px"
                    ></div>
                    <div class="d-flex justify-content-between mt-1">
                      <div
                        class="placeholder col-6 p-0 bg-secondary"
                        style="min-height: 9px"
                      ></div>
                      <div
                        class="placeholder col-1 p-0 bg-secondary"
                        style="min-height: 9px"
                      ></div>
                    </div>
                  </div>
                </div>
              </div>
            </ng-container>
            <p
              *ngIf="
                  !api.tweetList['tweetsCombined']?.length &&
                  loader_flag.tweet
                "
              class="custom-nodatafound text-center p-3 w-full bg-light rounded-3"
            >
              No Data Found
            </p>
            <ng-container
              *ngFor="
                  let tweet of api.tweetList['tweetsCombined']
                "
            >
              <app-twitter-card
                [cat]="cat"
                [subCat]="key"
                [tweet]="tweet"
                [corner]="corner"
              ></app-twitter-card>
            </ng-container>
            <app-spinner
              hideText="true"
              *ngIf="lazy_loader_[key]"
            ></app-spinner>
          </div>
        </div>
      </div>
    </ng-container>
  </div>
</div>
