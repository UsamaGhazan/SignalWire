<!-- News Details Body -->
<div class="container-big pd-32">
    <div class="news-details-body newsPage-gradient position-relative pd-32">
        <img class="news-ribbon" src="../../../../../assets/news-img/tweet-detail-ribbon.png" alt="">
        <div class="np-head d-flex flex-column align-items-center w-65 ms-auto me-auto">
            <h1 class="f-48 fw-700 text-black spaceGrotesk text-center" [innerHTML]="EastTweetsList.name"></h1>
            <div class="np-subHead d-flex justify-content-between w-100">
                <div class="d-flex cg-16 align-items-center flex-wrap gap-2">
                    <div class="d-flex cg-8 align-items-center">
                        <img [src]="EastTweetsList.profile_image_url" onerror='this.src="../../../../../assets/news-img/reuters-logo.png"'  alt="">
                        <p class="text-black f-24 manrope fw-700 text-opacity3 text-capitalize">{{EastTweetsList.screen_name}}</p>
                    </div>
                    <div class="d-flex cg-8 align-items-center">
                        <span class="big-dot"></span>
                        <p class="text-black f-18 fw-600 manrope text-opacity3">{{EastTweetsList.created_at}}</p>
                    </div>
                </div>
                <div class="d-flex gap-1">
                    <div class="source-link mouse d-flex flex-nowrap align-items-center" 
                        title="visit link" data-toggle="tooltip"
                        (click)="data.gotoLink('https://x.com/'+EastTweetsList.screen_name+'/status/'+EastTweetsList.id)">
                        <p class="text-nowrap">Source</p>
                        <img  src="../../../../../assets/news-img/link-icon.png" alt="" class="redirect-img mouse" >
                    </div>
                    <div class="d-flex cg-8 align-items-center">
                        <img src="../../../../../assets/news-img/printer-icon.png" alt="">
                        <p class="text-black f-16 fw-600 manrope text-opacity3">Print News</p>
                    </div>
                </div>
                
            </div>
        </div>
        <div class="np-body d-flex cg-16 mt-5 justify-content-end">
            <div class="np-mid d-flex flex-column rg-16 scrollbar-news mt-4">
                <div  class="d-flex cg-8 align-items-center position-relative" 
                    > 
                    <img class="npl-img" [src]="EastTweetsList.profile_image_url" onerror='this.src="../../../../../assets/news-img/reuters-logo.png"' alt="" style="    border-radius: 50%;
                    width: 75px; height: 75px;">
                    <!-- <img  src="../../../../../assets/news-img/link-icon.png" alt="" class="redirect-img mouse position-absolute" (click)="data.gotoLink('https://twitter.com/'+EastTweetsList.screen_name+'/status/'+EastTweetsList.id)"> -->

                    <div>
                        <p  class="text-black f-24 manrope fw-700 " >{{EastTweetsList.name}}</p>
                        <p  class="text-black f-22 manrope fw-700 text-opacity3">@{{EastTweetsList.screen_name}}</p>
                    </div>
                </div>
                <div class="d-flex align-items-center flex-column rg-16 tweeter-body">
                    <p class="big-description text-black manrope f-20 fw-400 me-auto text-justify" 
                    [innerHTML]="EastTweetsList.description"
                    >
                </p>    
                <ng-container *ngIf="EastTweetsList.tweet_image">
                    <img [src]="EastTweetsList.tweet_image" class="w-100"
                                        onerror='this.remove()' alt="">
                </ng-container>
                
            </div>
            </div>
            <div class="np-right d-flex flex-column rg-16 ">
                <div class="npl-head f-16 manrope fw-800 text-black">Related Tweets</div>
                <div class="npr-body d-flex flex-column rg-16 scrollbar-news" 
                    [style]="!is_loading.related && !relatedTweetsList.length && 'height: max-content;'">
                    <ng-container *ngIf="is_loading.related && !relatedTweetsList.length">
                        <div class="placeholder-glow mb-1" *ngFor="let l of [1,1,1,1,1,1]">
                            <div class="placeholder col-12 bg-light rounded-3 p-2">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="placeholder bg-secondary rounded-circle flex-shrink-0" 
                                        style="width: 41px; height: 41px;"></div>
                                    <div class="d-flex flex-column w-full">
                                        <div class="placeholder col-5 bg-secondary p-0 m-0" style="min-height: 10px;"></div>
                                        <div class="placeholder col-4 bg-secondary p-0 mt-1" style="min-height: 8px;"></div>
                                    </div>
                                </div>
                                <div class="mt-1 d-flex flex-column gap-2">
                                    <div class="placeholder col-12 p-0 bg-secondary" style="min-height: 8px;"></div>
                                    <div class="d-flex justify-content-between gap-1 overflow-hidden">
                                        <div class="placeholder col-10 py-0 bg-secondary" style="min-height: 8px;"></div>
                                        <div class="placeholder col-2 py-0 bg-secondary" style="min-height: 8px;"></div>
                                    </div>
                                    <div class="d-flex justify-content-end">
                                        <div class="placeholder col-4 p-0 bg-secondary" style="min-height: 8px;"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </ng-container>
                    <p *ngIf="!relatedTweetsList.length && !is_loading.related" class="custom-nodatafound text-center p-3 w-full bg-light rounded-3">No Data Found</p>
                    <div class="sm-news-card d-flex flex-column" (click)="readMore('/tweet-details',rel.id)" *ngFor="let rel of relatedTweetsList">
                        <!-- <div class="npl-image">
                            <img class="npl-img" [src]="rel.profile_image_url" onerror='this.src="../../../../../assets/images/noimg.png"' alt="">
                        </div> -->
                        <div  class="d-flex cg-8 align-items-center mouse" 
                            (click)="data.gotoLink('https://twitter.com/'+rel.screen_name,$event)"> 
                            <img class="npl-img" [src]="rel.profile_image_url" onerror='this.src="../../../../../assets/images/noimg.png"' 
                                alt="" style="border-radius: 50%;width: 37px;">
                            <div>
                                <p  class="text-black f-24 manrope fw-700" style="font-size: 12px;">{{rel.name}}</p>
                                <p  class="text-black f-24 manrope fw-700" style="font-size: 11px;">@{{rel.screen_name}}</p>
                            </div>
                        </div>
                        <div class="npl-main d-flex flex-column">
                            <!-- <h3 class="text-black f-14 manrope fw-700 truncate-text2 mt-2" >@{{rel.screen_name}}</h3> -->
                            <div class="d-flex align-items-end">
                                <p class="text-grey f-14 truncate-text3 manrope fw-400" [innerHTML]="rel.description" style="line-height: 1.8;"> </p>
                                <p href="" class="no-underline text-black f-12 manrope fw-600 text-nowrap mouse" 
                                    (click)="data.gotoLink('https://twitter.com/'+rel.screen_name+'/status/'+rel.id_str,$event)">Read More</p>
                            </div>
                            <div class="date-time d-flex align-items-center text-opacity3 align-self-end">
                                <p class="color-black manrope f-10 fw-700 text-right">{{rel.created_at}}</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="npl-head f-16 manrope fw-800 text-black">Keywords</div>
                <div class="d-flex flex-wrap rg-8 cg-8 scrollbar-news overflow-y-auto" style="max-height: 12rem;">
                    <p *ngIf="!EastTweetsList.keywords?.length" class="custom-nodatafound text-center p-3 w-full bg-light rounded-3">No Tag Found</p>
                    <div class="border border-dark f-14 fw-400 manrope rounded-5 px-3 py-2 mouse text-truncate"
                        style="max-width: 10rem;" [title]="keyword" data-toggle="tooltip"
                        *ngFor="let keyword of EastTweetsList.keywords"
                        (click)="readMore('/tag-details',keyword)">
                        {{keyword}}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
        


<!-- loader -->
<ngx-ui-loader fgsColor="transparent" bgsColor="red" bgsPosition="bottom-center" logoPosition="center-center" [logoSize]="160" [gap]="20"
    logoUrl="/assets/news-img/main-logo-gif.gif" [attr.bgsOpacity]="0"></ngx-ui-loader>
